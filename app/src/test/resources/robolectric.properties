# Robolectric 全局配置（对 src/test 下所有包生效）。
#
# 关闭 Conscrypt：Robolectric 默认会把 Conscrypt 注册为 JVM 全局的首选安全提供者，且测试结束后不会移除。
# 同一个 JVM 中后运行的集成测试（连接本地 Openfire）里，Smack 创建的 SSLContext 会来自 Conscrypt，
# 而 TrustManager 来自 JDK 的 SunJSSE，TLS 1.3 握手时报 "Unknown authType: GENERIC"。
# 本项目的 Robolectric 测试不涉及 Android 侧的 SSL，关闭不受影响。
conscryptMode=OFF
