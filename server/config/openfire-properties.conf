# Openfire 系统属性，由 scripts/apply-properties.sh 写入数据库（ofProperty 表），有变化时自动重启 Openfire。
# 格式：属性名=值；值中可使用 ${IM_DOMAIN}。修改后重新运行 up.sh 或 scripts/apply-properties.sh 即可。

# ---------- 连接与认证（协议规范 §2.1、§2.4、§3.2） ----------
# 客户端连接必须使用 TLS（STARTTLS），禁止明文
xmpp.client.tls.policy=required
# 只启用 SCRAM-SHA-1，禁止 PLAIN 等明文机制（协议规范 §2.1）
sasl.mechs=SCRAM-SHA-1
# 禁止匿名登录
xmpp.auth.anonymous=false
# 关闭自助注册，允许已登录用户通过 XEP-0077 修改密码
register.inband=false
register.password=true
# 同一 resource 重复登录时立即踢掉旧连接（0 = 不尝试保留旧连接），旧连接收到 <conflict/>
xmpp.session.conflict-limit=0
# 流管理（XEP-0198），支持断线恢复
stream.management.active=true
# 不需要文件传输代理（文件走 HTTP 上传）
xmpp.proxy.enabled=false

# ---------- HTTP 文件上传（协议规范 §9） ----------
# 客户端拿到的上传 / 下载地址：https://{域名}:7443/httpfileupload/...
plugin.httpfileupload.announcedWebProtocol=https
plugin.httpfileupload.announcedWebHost=${IM_DOMAIN}
plugin.httpfileupload.announcedWebPort=7443
# 单个文件上限 100 MB（协议规范 §1.6）
plugin.httpfileupload.maxFileSize=104857600
# 文件存储目录（Docker 数据卷）
plugin.httpfileupload.fileRepo=/var/lib/openfire/upload

# ---------- 消息存档 MAM（Monitoring 插件，协议规范 §11） ----------
conversation.metadataArchiving=true
conversation.messageArchiving=true
conversation.roomArchiving=true
# 群聊按原始 stanza 存档，MAM 查询群历史需要
conversation.roomArchivingStanzas=true
