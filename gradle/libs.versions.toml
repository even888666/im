# 依赖版本统一在此管理。规则（见 Android工程架构.md §1.2）：
# - 一律使用最新正式版，禁止 alpha / beta / rc 等预发布版本；
# - 添加或升级前运行 `python3 -I scripts/dev/latest_versions.py` 查询确认，不凭记忆填写；
# - 最新正式版不兼容时退回兼容的最高正式版，并在此用注释写明原因。

[versions]
agp = "9.4.1"
# Kotlin 版本：AGP 9 内置 Kotlin 支持，应用 serialization 插件时会把 KGP 升到同一版本，二者必须一致
kotlin = "2.4.21"
ksp = "2.3.12"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
fragmentKtx = "1.9.1"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
logbackAndroid = "0.1.2"
androidxStartup = "1.2.0"
# Smack：用户确认直接使用最新正式版（4.5.x）
smack = "4.5.0"
desugarJdkLibs = "2.1.5"
datastore = "1.2.1"
work = "2.12.0"
room = "2.8.5"
paging = "3.5.3"
coil = "3.6.3"
okhttp = "5.5.0"
exifinterface = "1.4.2"
media3 = "1.11.1"
# 测试
androidxTestCore = "1.7.0"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.17"
mockk = "1.14.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
logback-android = { module = "cn.android666:logback-android", version.ref = "logbackAndroid" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }
smack-android-extensions = { module = "org.igniterealtime.smack:smack-android-extensions", version.ref = "smack" }
smack-tcp = { module = "org.igniterealtime.smack:smack-tcp", version.ref = "smack" }
smack-experimental = { module = "org.igniterealtime.smack:smack-experimental", version.ref = "smack" }
# JVM 版 Smack，仅用于连接本地 Openfire 的集成测试
smack-java11 = { module = "org.igniterealtime.smack:smack-java11", version.ref = "smack" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# Coil 3：图片加载（头像、聊天图片）；网络图片通过 coil-network-okhttp 使用全局 OkHttpClient（CLAUDE.md §4）
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
# HTTP：文件上传 / 下载（XEP-0363）、Coil 加载网络图片，统一使用只信任企业根证书的 OkHttpClient（开发计划 5.1）
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# 读取照片的 EXIF 方向（头像处理），比系统自带的 android.media.ExifInterface 兼容性好
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
# Media3：视频消息的压缩（Transformer + Effect）与播放（ExoPlayer + UI），开发计划 5.7
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Room：2.7 起 room-ktx 的协程支持已并入 room-runtime
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# 聊天页分页（开发计划 4.8）：Room 直接生成 PagingSource
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
# 测试
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room Gradle 插件：导出 schema 到 app/schemas/，并提供给迁移测试
room = { id = "androidx.room", version.ref = "room" }
